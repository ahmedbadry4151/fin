services:
  postgres:
    image: postgres:16-alpine
    container_name: fintwin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fintwin
      POSTGRES_PASSWORD: fintwin_dev
      POSTGRES_DB: fintwin
    ports:
      - "5433:5432"
    volumes:
      - fintwin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintwin -d fintwin"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fintwin_pgdata:
